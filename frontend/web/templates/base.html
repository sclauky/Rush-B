<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rush-B Forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/responsive.css" />
</head>
<body>
  <div class="site-bg"></div>

  <div id="page-loading-overlay" class="page-loading-overlay welcome-overlay" aria-hidden="true">
    <div class="page-loading-card page-loading-welcome">
      <svg class="welcome-svg" viewBox="0 0 420 120" aria-hidden="true">
        <text class="welcome-text" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle">RUSH-B</text>
      </svg>
      <p class="page-loading-subtitle">Le forum où les squads se forment.</p>
    </div>
  </div>

<nav class="navbar">
  <div class="container nav-inner">
    <a href="/" class="logo">
      <div class="logo-mark">B</div>
      <span class="logo-text">RUSH-B</span>
    </a>

    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menu</button>
    <div class="nav-links" id="site-navigation">
      <a href="/">Accueil</a>
      <a href="/posts">Posts</a>
      <a href="/create-post" class="nav-plus" aria-label="Créer un post"><span>+</span></a>
      <a href="/swipe">Finder</a>
      <a href="/profile">Profil</a>
    </div>

    <a href="/users/search" class="nav-search" aria-label="Rechercher un utilisateur">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 16 16"
        fill="currentColor"
      >
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
      </svg>
    </a>

    <div class="nav-actions">
      <a href="/logout" class="btn btn-secondary">Déconnexion</a>
    </div>
  </div>
</nav>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© 2026 RUSH-B — Forum gaming communautaire.</p>
      <div class="footer-links">
        <a href="/">Accueil</a>
        <a href="/posts">Explorer</a>
        <a href="/register">Rejoindre</a>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/loadingscreen.js"></script>
</body>
</html>
