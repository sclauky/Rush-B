<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page introuvable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/error.css">
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page introuvable</h1>
      <p class="error-text">
        La page que tu cherches n’existe pas, a été déplacée ou l’adresse entrée est incorrecte.
      </p>
      <div class="error-actions">
        <a href="/" class="error-btn primary">Retour à l’accueil</a>
        <a href="/posts" class="error-btn secondary">Voir les posts</a>
      </div>
    </section>
  </main>
</body>
</html>
